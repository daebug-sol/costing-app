services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: costing_dev
    volumes:
      - costing_pg_data:/var/lib/postgresql/data

volumes:
  costing_pg_data:
