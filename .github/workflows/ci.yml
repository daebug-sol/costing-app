name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  AUTH_BYPASS: "true"
  TEST_USER_ID: test-user-ci
  TEST_ORG_ID: org_ci_test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/costing_test?schema=public
  NODE_ENV: test

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: costing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          AUTH_BYPASS: "true"
